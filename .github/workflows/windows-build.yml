name: Windows MSYS2 Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: Set up MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-pkgconf
          mingw-w64-ucrt-x86_64-sdl3
          mingw-w64-ucrt-x86_64-sdl3-image
          mingw-w64-ucrt-x86_64-sdl3-mixer
          mingw-w64-ucrt-x86_64-sdl3-ttf
          mingw-w64-ucrt-x86_64-librsvg
          mingw-w64-ucrt-x86_64-libxml2
          mingw-w64-ucrt-x86_64-gettext
          make

    - name: Checkout tuxtype
      uses: actions/checkout@v4
      with:
        path: tuxtype

    - name: Checkout t4kcommon
      uses: actions/checkout@v4
      with:
        repository: Midhun-M-git/t4kcommon
        path: t4kcommon

    - name: Build and Install t4kcommon
      run: |
        cd t4kcommon
        mkdir build && cd build
        cmake .. -DCMAKE_INSTALL_PREFIX=/ucrt64 -G "MSYS Makefiles"
        make -j$(nproc)
        make install

    - name: Build tuxtype
      run: |
        cd tuxtype
        mkdir build && cd build
        cmake .. -DCMAKE_INSTALL_PREFIX=/ucrt64 -G "MSYS Makefiles"
        make -j$(nproc)

    - name: Package Artifacts
      run: |
        mkdir TuxType-Windows
        # Copy Executable and Library
        cp tuxtype/build/src/TuxType.exe TuxType-Windows/
        cp t4kcommon/build/src/libt4k_common.dll TuxType-Windows/
        
        # Copy necessary MSYS2 DLLs using ldd to trace dependencies
        # (A simple script to extract DLLs from the ucrt64/bin folder)
        ldd TuxType-Windows/TuxType.exe | grep '\/ucrt64\/bin' | awk '{print $3}' | xargs -I '{}' cp '{}' TuxType-Windows/ || true
        
        # Copy Data Directory
        cp -r tuxtype/data TuxType-Windows/data

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TuxType-Windows
        path: TuxType-Windows/
